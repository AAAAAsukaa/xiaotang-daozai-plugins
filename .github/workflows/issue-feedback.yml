name: 插件反馈分流
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
concurrency:
  group: plugin-feedback-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  notify:
    name: 通知维护者
    if: github.event.sender.type != 'Bot'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: 按插件 ID 路由
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/route_feedback.py
